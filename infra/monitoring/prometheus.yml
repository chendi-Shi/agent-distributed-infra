# Prometheus configuration for Agent Infrastructure Monitoring

global:
  scrape_interval: 15s      # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'agent-infra'
    environment: 'dev'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']

# Load rules once and periodically evaluate them
# rule_files:
#   - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Agent Metrics Server
  - job_name: 'agent-metrics'
    static_configs:
      - targets: ['host.docker.internal:9091']  # Agent metrics server
        labels:
          service: 'agent-infrastructure'
          component: 'core'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Router Metrics (if exposed separately)
  - job_name: 'router'
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          service: 'agent-infrastructure'
          component: 'router'
    scrape_interval: 10s

  # Redis Exporter (optional - requires redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         service: 'redis'

  # RabbitMQ Metrics (built-in)
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']  # RabbitMQ Prometheus plugin port
        labels:
          service: 'rabbitmq'
    scrape_interval: 30s
    metrics_path: '/metrics'

  # PostgreSQL Exporter (optional - requires postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgres'

  # Node Exporter (optional - for system metrics)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node'
